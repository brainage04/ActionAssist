name: build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every Minecraft and loader target
        run: ./gradlew --no-daemon build
      # The MinecraftModConventions client GameTest packages, plus a Vulkan driver: 26.3 clients
      # fall back to Vulkan when they cannot create an OpenGL context under Xvfb.
      - name: Install client test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils mesa-utils libflite1 libgl1-mesa-dri libglx-mesa0 \
            libxi6 libxrandr2 libxrender1 libxtst6 libxinerama1 libxcursor1 libxxf86vm1 libxss1 \
            libxkbcommon0 mesa-vulkan-drivers
      - name: Run every client GameTest in one task graph
        env:
          ALSOFT_DRIVERS: "null"
          GTR_RECORDING_MANAGED_XVFB: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x720x24"
          ./gradlew --no-daemon --no-parallel --continue
          :mc263Fabric:runClientGameTest
          :mc263Fabric:runProductionClientGameTest
          :mc1211Neoforge:runClientGameTest
          platformGameTest
      - uses: actions/upload-artifact@v4
        with:
          name: action-assist-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 3
