# Releases every Minecraft version and loader JAR from an annotated v* tag. The reusable
# multi-loader release workflow handles two JARs; this build ships one pair per target.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  github:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify the tag matches mod_version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "Expected tag v${VERSION}, got ${TAG_NAME}"
            exit 1
          fi
      - name: Build every Minecraft and loader target
        run: ./gradlew --no-daemon build
      - name: Resolve release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          NOTES="$(git for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(contents)')"
          if [ -z "${NOTES}" ]; then
            NOTES="$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${RELEASE_TAG}" \
              -f "target_commitish=${GITHUB_SHA}" \
              --jq '.body')"
          fi
          printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          mapfile -t ARTIFACTS < <(compgen -G "build/libs/*-${VERSION}.jar" | sort)
          if [ "${#ARTIFACTS[@]}" -ne 16 ]; then
            echo "Expected 16 release JARs in build/libs; found ${#ARTIFACTS[@]}."
            exit 1
          fi
          PRERELEASE_ARGUMENT=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE_ARGUMENT+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "${RELEASE_TAG}" "${ARTIFACTS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" "${ARTIFACTS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --verify-tag \
              "${PRERELEASE_ARGUMENT[@]}"
          fi
