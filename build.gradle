plugins {
    id "java"
    id "dev.architectury.loom" version "${architectury_loom_version}" apply false
    id "dev.architectury.loom-no-remap" version "${architectury_loom_version}" apply false
    id "net.fabricmc.fabric-loom" version "${fabric_loom_version}" apply false
    id "io.github.brainage04.client-gametest-recorder" version "${fabricmoddingconventions_version}" apply false
    id "io.github.brainage04.production-gametests" version "${fabricmoddingconventions_version}" apply false
}

group = maven_group
version = mod_version

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main.java.setSrcDirs(["src/core/java"])
    main.resources.setSrcDirs([])
    test.java.setSrcDirs(["src/test/java"])
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

jar.enabled = false

ext.minecraftTargets = [
        mc1211 : [minecraft: "1.21.1",  fabricApi: "0.116.14+1.21.1",  neoForge: "21.1.244",       java: 21],
        mc1214 : [minecraft: "1.21.4",  fabricApi: "0.119.4+1.21.4",   neoForge: "21.4.157",       java: 21],
        mc1215 : [minecraft: "1.21.5",  fabricApi: "0.125.3+1.21.5",   neoForge: "21.5.98",        java: 21],
        mc1218 : [minecraft: "1.21.8",  fabricApi: "0.136.1+1.21.8",   neoForge: "21.8.54",        java: 21],
        mc12110: [minecraft: "1.21.10", fabricApi: "0.138.4+1.21.10",  neoForge: "21.10.64",       java: 21],
        mc12111: [minecraft: "1.21.11", fabricApi: "0.141.5+1.21.11",  neoForge: "21.11.44",       java: 21],
        mc2612 : [minecraft: "26.1.2",  fabricApi: "0.155.2+26.1.2",   neoForge: "26.1.2.87",       java: 25],
        mc262  : [minecraft: "26.2",    fabricApi: "0.155.2+26.2",     neoForge: "26.2.0.35-beta",  java: 25]
]

subprojects { targetProject ->
    def matcher = (targetProject.name =~ /^(mc\d+)(Fabric|Neoforge)$/)
    if (!matcher.matches()) {
        throw new GradleException("Unexpected target project ${targetProject.path}")
    }

    def targetId = matcher.group(1)
    def loader = matcher.group(2).toLowerCase()
    def target = rootProject.minecraftTargets[targetId]

    def unobfuscated = target.java == 25
    def unobfuscatedFabric = loader == "fabric" && unobfuscated
    apply plugin: "java"
    if (loader == "neoforge" && unobfuscated) {
        apply plugin: "dev.architectury.loom-no-remap"
        apply plugin: "dev.architectury.loom"
    } else {
        apply plugin: unobfuscatedFabric ? "net.fabricmc.fabric-loom" : "dev.architectury.loom"
    }

    def productionClientGameTests = targetId == "mc262" && loader == "fabric"
    def modpackGameTest = targetId == "mc1211" && loader == "neoforge"
    def platformTarget = "${target.minecraft}-${loader}"
    def platformRunDir = rootProject.file("run/platformGameTest/${platformTarget}")
    if (productionClientGameTests) {
        targetProject.ext.mod_side = "client"
        targetProject.ext.fabric_api_version = target.fabricApi
        targetProject.ext.minecraft_version = target.minecraft
        targetProject.ext.java_version = target.java
        apply plugin: "io.github.brainage04.production-gametests"
        if (targetProject.extensions.findByName("fabricModConventions") != null) {
            fabricModConventions {
                repositoriesEnabled.set(false)
                javaEnabled.set(false)
                sourcesJarEnabled.set(false)
                resourceExpansionEnabled.set(false)
                licenseJarEnabled.set(false)
            }
        }
    }

    group = rootProject.maven_group
    version = rootProject.mod_version

    base {
        archivesName = "${rootProject.archives_base_name}-${target.minecraft}-${loader}"
    }

    repositories {
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
        maven {
            url = "https://cursemaven.com"
            content { includeGroup "curse.maven" }
        }
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        ivy {
            name = "SquatGrowModrinthCdn"
            url = "https://cdn.modrinth.com/data/b5JMdB5V/versions"
            patternLayout {
                artifact "[revision]/[artifact].[ext]"
            }
            metadataSources { artifact() }
            content { includeGroup "modrinth.direct" }
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = target.java as int
    }

    sourceSets {
        main {
            java.setSrcDirs([
                    rootProject.file("src/core/java"),
                    rootProject.file("src/client/java"),
                    rootProject.file("src/${loader}/java")
            ])
            resources.setSrcDirs([
                    rootProject.file("src/shared/resources"),
                    rootProject.file("src/${loader}/resources")
            ])
        }
    }
    sourceSets {
        gametest {
            def gameTestJava = [
                    rootProject.file("src/gametest/platform/java"),
                    rootProject.file("src/gametest/${loader}/java")
            ]
            if (productionClientGameTests) {
                gameTestJava += rootProject.file("src/gametest/fabric-production/java")
            }
            java.setSrcDirs(gameTestJava)
            resources.setSrcDirs(loader == "fabric"
                    ? [rootProject.file(productionClientGameTests
                            ? "src/gametest/fabric-production/resources"
                            : "src/gametest/fabric/resources")]
                    : [])
            if (!productionClientGameTests) {
                compileClasspath += sourceSets.main.output + configurations.compileClasspath
                runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
            }
        }
    }
    if (modpackGameTest) {
        // A separate source set, so the real mods reach the ATM10TTS run's classpath and no other.
        sourceSets {
            modpack {
                java.setSrcDirs([rootProject.file("src/gametest/neoforge-modpack/java")])
                resources.setSrcDirs([])
                compileClasspath += sourceSets.main.output + configurations.compileClasspath
                runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
            }
        }
        configurations {
            modpackRuntimeBundle
        }
        loom.addRemapConfiguration("modModpack") {
            it.sourceSet.set(sourceSets.modpack)
            it.targetConfigurationName.set(sourceSets.modpack.runtimeOnlyConfigurationName)
            it.onCompileClasspath.set(false)
            it.onRuntimeClasspath.set(true)
        }
    }
    if (productionClientGameTests) {
        productionGameTests {
            includeClient.set(true)
            includeServer.set(false)
            clientRunDir.set(rootProject.layout.projectDirectory.dir("run/clientGameTest/26.2-fabric-production"))
            clientUseXvfb.set(
                    providers.environmentVariable("GTR_RECORDING_MANAGED_XVFB")
                            .map { !it.toBoolean() }
                            .orElse(true)
            )
        }
    }

    loom {
        if (!unobfuscated) {
            silentMojangMappingsLicense()
        }
        if (loader == "neoforge") {
            neoForge { }
        }
        // Loom also registers the main source set as mod group "main"; NeoForge's in-development
        // locator keeps one group per mod, so the NeoForge GameTest classes must join that group.
        def modGroup = mods.maybeCreate(loader == "neoforge" ? "main" : "actionassist")
        modGroup.sourceSet(sourceSets.main)
        if (loader == "neoforge") {
            modGroup.sourceSet(sourceSets.gametest)
        }
        if (modpackGameTest) {
            modGroup.sourceSet(sourceSets.modpack)
        }
        mods {
            if (loader == "fabric" && !productionClientGameTests) {
                actionassistGametest {
                    sourceSet sourceSets.gametest
                }
            }
        }
        runs {
            client {
                runDir rootProject.file("run/${target.minecraft}-${loader}").absolutePath
            }
            if (productionClientGameTests) {
                clientGameTest {
                    runDir rootProject.file(
                            "run/clientGameTest/26.2-fabric-development"
                    ).absolutePath
                }
            }
            platformGameTest {
                client()
                name "Action Assist Platform GameTest (${platformTarget})"
                source sourceSets.gametest
                runDir platformRunDir.absolutePath
                property "actionassist.platformGameTest", "true"
                property "actionassist.platformTarget", platformTarget
                programArgs "--quickPlaySingleplayer", "actionassist-platform"
            }
            if (modpackGameTest) {
                clientGameTest {
                    client()
                    name "Action Assist ATM10TTS Client GameTest"
                    source sourceSets.modpack
                    runDir rootProject.file("run/clientGameTest/1.21.1-neoforge").absolutePath
                    property "actionassist.modpackGameTest", "true"
                }
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${target.minecraft}"
        if (!unobfuscated) {
            mappings loom.officialMojangMappings()
        }
        if (loader == "fabric" && !unobfuscated) {
            modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        } else if (loader == "fabric") {
            implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        } else {
            neoForge "net.neoforged:neoforge:${target.neoForge}"
        }
        if (modpackGameTest) {
            modModpack "maven.modrinth:ex-deorum:3.10"
            modModpack "modrinth.direct:squatgrow-neoforge-21.1.2+mc1.21.1:OFCYuLn8"
            modModpack "maven.modrinth:cloth-config:15.0.140+neoforge"
            modModpack "maven.modrinth:mystical-agriculture:8.0.22"
            modModpack "maven.modrinth:cucumber:8.0.15"
            modModpack "curse.maven:kubejs-238086:7278501"
            modpackRuntimeBundle "curse.maven:kubejs-238086:7278501"
            forgeRuntimeLibrary files(
                    layout.buildDirectory.file("modpack-runtime-libs/tiny-java-server-1.0.0-build.33.jar"),
                    layout.buildDirectory.file("modpack-runtime-libs/animated-gif-lib-for-java-animated-gif-lib-1.7.jar")
            )
            modModpack "curse.maven:rhino-416294:7104526"
            modModpack "curse.maven:architectury-api-419699:5786327"
            modModpack "curse.maven:ftb-library-forge-404465:7420412"
            modModpack "curse.maven:ftb-ultimine-forge-386134:7570482"
        }
    }

    tasks.named("processResources") {
        inputs.properties([
                mod_id           : rootProject.mod_id,
                mod_name         : rootProject.mod_name,
                mod_version      : rootProject.mod_version,
                minecraft_version: target.minecraft,
                java_level       : target.java
        ])
        filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml", "actionassist.mixins.json"]) {
            expand(
                    mod_id           : rootProject.mod_id,
                    mod_name         : rootProject.mod_name,
                    mod_version      : rootProject.mod_version,
                    minecraft_version: target.minecraft,
                    java_level       : target.java
            )
        }
    }
    if (loader == "fabric") {
        tasks.named("processGametestResources") {
            inputs.properties([
                    mod_id     : rootProject.mod_id,
                    mod_name   : rootProject.mod_name,
                    mod_version: rootProject.mod_version
            ])
            filesMatching("fabric.mod.json") {
                expand(
                        mod_id     : rootProject.mod_id,
                        mod_name   : rootProject.mod_name,
                        mod_version: rootProject.mod_version
                )
            }
        }
    }
    def preparePlatformGameTest = tasks.register("preparePlatformGameTest", Sync) {
        from rootProject.file("src/gametest/fixtures/platform")
        // Each 26.x release asks to back up and file-fix worlds saved by an earlier release, which
        // would stall quick play; 1.21.x opens the 1.21.1 world without asking.
        from rootProject.file("src/gametest/fixtures/platform-world-${unobfuscated ? target.minecraft : "1.21"}")
        into platformRunDir
        preserve {
            include "**"
            exclude "saves/actionassist-platform/**", "config/actionassist.properties", "options.txt", "actionassist-platform-report.properties"
        }
    }
    tasks.matching { it.name == "runPlatformGameTest" }.configureEach {
        dependsOn preparePlatformGameTest
        timeout = java.time.Duration.ofMinutes(10)
    }
    if (productionClientGameTests) {
        ["run/clientGameTest/26.2-fabric-development": "runClientGameTest",
         "run/clientGameTest/26.2-fabric-production": "runProductionClientGameTest"].each { dir, runTask ->
            def prepare = tasks.register("prepare${runTask.capitalize()}Config", Copy) {
                from rootProject.file("src/gametest/fixtures/platform/config")
                into rootProject.file("${dir}/config")
            }
            tasks.matching { it.name == runTask }.configureEach {
                dependsOn prepare
            }
        }
        tasks.register(
                "recordClientGameTest",
                io.github.brainage04.fabricmoddingconventions.gradle.recorder.RecordClientGameTestTask
        ) {
            group = "verification"
            description = "Records the packaged Fabric client GameTest."
            projectDirectory.convention(rootProject.layout.projectDirectory)
            runDirectory.fileValue(
                    rootProject.file("run/clientGameTest/26.2-fabric-production")
            )
            recordingAudioDeviceProjectProperty.convention("FabricModdingConventionsRecordingAudioDevice")
            runTaskName.convention("${targetProject.path}:runProductionClientGameTest")
            outputs.upToDateWhen { false }
        }
    }

    tasks.named("jar") {
        manifest.attributes(
                "Implementation-Title": rootProject.mod_name,
                "Implementation-Version": rootProject.mod_version,
                "Minecraft-Version": target.minecraft,
                "Mod-Loader": loader
        )
    }
    if (modpackGameTest) {
        def gameTestRunDir = rootProject.file("run/clientGameTest/1.21.1-neoforge")
        def clearModpackClientGameTestWorld = tasks.register("clearModpackClientGameTestWorld", Delete) {
            delete new File(gameTestRunDir, "saves/actionassist-modpack-gametest")
            delete new File(gameTestRunDir, "config/squatgrow-common.yaml")
        }
        def extractModpackRuntimeLibraries = tasks.register("extractModpackRuntimeLibraries", Sync) {
            from({ zipTree(configurations.modpackRuntimeBundle.singleFile) }) {
                include "META-INF/jarjar/*.jar"
                eachFile { path = name }
                includeEmptyDirs = false
            }
            into layout.buildDirectory.dir("modpack-runtime-libs")
        }
        def prepareModpackClientGameTest = tasks.register("prepareModpackClientGameTest", Copy) {
            dependsOn clearModpackClientGameTestWorld, extractModpackRuntimeLibraries
            from rootProject.file("src/gametest/fixtures/neoforge-1.21.1")
            into gameTestRunDir
        }
        tasks.named("runClientGameTest") {
            dependsOn prepareModpackClientGameTest
        }
        tasks.register(
                "recordClientGameTest",
                io.github.brainage04.fabricmoddingconventions.gradle.recorder.RecordClientGameTestTask
        ) {
            group = "verification"
            description = "Runs the NeoForge client compatibility GameTest under the convention recorder."
            projectDirectory.convention(rootProject.layout.projectDirectory)
            runDirectory.fileValue(gameTestRunDir)
            recordingAudioDeviceProjectProperty.convention("FabricModdingConventionsRecordingAudioDevice")
            runTaskName.convention("${targetProject.path}:runClientGameTest")
            outputs.upToDateWhen { false }
        }
    }
}

tasks.register("collectReleaseArtifacts", Sync) {
    dependsOn subprojects.collect { it.tasks.named("build") }
    from(subprojects.collect { targetProject ->
        def matcher = (targetProject.name =~ /^(mc\d+)(Fabric|Neoforge)$/)
        if (!matcher.matches()) {
            throw new GradleException("Unexpected target project ${targetProject.path}")
        }
        def target = minecraftTargets[matcher.group(1)]
        def releaseTask = target.java == 25 ? "jar" : "remapJar"
        targetProject.tasks.named(releaseTask).flatMap { task -> task.archiveFile }
    })
    into layout.buildDirectory.dir("libs")
}

tasks.named("build") {
    dependsOn tasks.named("collectReleaseArtifacts")
}

// Runs the same platform scenario on every Minecraft version and loader, one client at a time, and
// requires every target to report the same outcome. Run it under a display (e.g. xvfb-run).
tasks.register("platformGameTest") {
    group = "verification"
    description = "Runs the platform client GameTest on every target and compares the reports."
    def runTasks = subprojects.collect { it.tasks.named("runPlatformGameTest") }
    dependsOn runTasks
    for (int index = 1; index < runTasks.size(); index++) {
        def previous = runTasks[index - 1]
        runTasks[index].configure { mustRunAfter previous }
    }
    def reports = subprojects.collect { targetProject ->
        def matcher = (targetProject.name =~ /^(mc\d+)(Fabric|Neoforge)$/)
        matcher.matches()
        def target = minecraftTargets[matcher.group(1)]
        file("run/platformGameTest/${target.minecraft}-${matcher.group(2).toLowerCase()}/actionassist-platform-report.properties")
    }
    doLast {
        def outcomes = reports.collect { reportFile ->
            if (!reportFile.exists()) {
                throw new GradleException("Missing platform GameTest report ${reportFile}")
            }
            def properties = new Properties()
            reportFile.withInputStream { properties.load(it) }
            [
                    target: properties.getProperty("target"),
                    outcome: [
                            result: properties.getProperty("result"),
                            pebbleConserved: properties.getProperty("pebble.conserved"),
                            compactedTypes: properties.getProperty("pebble.compactedTypes"),
                            pauseReleasedInputs: properties.getProperty("crop.pauseReleasedInputs")
                    ]
            ]
        }
        outcomes.each { logger.lifecycle("${it.target}: ${it.outcome}") }
        def distinct = outcomes.collect { it.outcome }.unique()
        if (distinct.size() != 1 || distinct[0].result != "pass") {
            throw new GradleException("Platform GameTest outcomes differ or failed: ${outcomes}")
        }
    }
}
